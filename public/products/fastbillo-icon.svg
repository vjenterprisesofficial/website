<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="fastbilloGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7bf45" />
      <stop offset="100%" stop-color="#e4422d" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7a4e1f" flood-opacity="0.18" />
    </filter>
  </defs>
  <!-- Background Rounded Tile -->
  <rect x="8" y="8" width="104" height="104" rx="26" fill="url(#fastbilloGrad)" filter="url(#softShadow)" />
  
  <!-- Subtle Inner Border -->
  <rect x="9.5" y="9.5" width="101" height="101" rx="24.5" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Bill / POS Receipt Visual -->
  <g transform="translate(30, 24)">
    <!-- White Card -->
    <rect x="0" y="0" width="60" height="74" rx="8" fill="#ffffff" />
    
    <!-- Header bar -->
    <rect x="10" y="10" width="40" height="6" rx="3" fill="#e4422d" />
    
    <!-- Receipt Lines -->
    <rect x="10" y="22" width="28" height="4" rx="2" fill="#26221e" opacity="0.85" />
    <rect x="42" y="22" width="8" height="4" rx="2" fill="#e4422d" />
    
    <rect x="10" y="30" width="22" height="4" rx="2" fill="#665b51" opacity="0.65" />
    <rect x="42" y="30" width="8" height="4" rx="2" fill="#665b51" opacity="0.65" />

    <rect x="10" y="38" width="25" height="4" rx="2" fill="#665b51" opacity="0.65" />
    <rect x="42" y="38" width="8" height="4" rx="2" fill="#665b51" opacity="0.65" />
    
    <!-- Divider -->
    <line x1="10" y1="48" x2="50" y2="48" stroke="#f7bf45" stroke-width="1.5" stroke-dasharray="3 2" />
    
    <!-- Total highlight -->
    <rect x="10" y="54" width="18" height="5" rx="2.5" fill="#26221e" />
    <rect x="36" y="53" width="14" height="7" rx="3" fill="#e4422d" />
    
    <!-- Checkmark badge in bottom corner -->
    <circle cx="50" cy="64" r="11" fill="#f7bf45" stroke="#ffffff" stroke-width="2" />
    <path d="M46.5 64 L49 66.5 L54 61.5" stroke="#26221e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
